apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterfuzz-bot
  namespace: clusterfuzz
  labels:
    app: clusterfuzz-bot
    component: bot
    version: v1
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: clusterfuzz-bot
  template:
    metadata:
      labels:
        app: clusterfuzz-bot
        component: bot
        version: v1
    spec:
      serviceAccountName: clusterfuzz-bot
      containers:
      - name: clusterfuzz-bot
        image: gcr.io/clusterfuzz/clusterfuzz-bot:latest
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes,production"
        - name: JAVA_OPTS
          value: "-Xmx4g -Xms2g -XX:+UseG1GC -XX:+UseStringDeduplication"
        - name: BOT_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: BOT_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: clusterfuzz-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: clusterfuzz-secrets
              key: redis-url
        - name: GOOGLE_CLOUD_PROJECT
          valueFrom:
            configMapKeyRef:
              name: clusterfuzz-config
              key: gcp-project-id
        - name: STORAGE_BUCKET
          valueFrom:
            configMapKeyRef:
              name: clusterfuzz-config
              key: storage-bucket
        - name: FUZZING_ENGINES
          value: "libfuzzer,afl,honggfuzz"
        - name: MAX_CONCURRENT_TASKS
          value: "4"
        - name: TASK_TIMEOUT_MINUTES
          value: "60"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: work-volume
          mountPath: /work
        - name: temp-volume
          mountPath: /tmp
        - name: corpus-volume
          mountPath: /corpus
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Bots need to write to work directories
          capabilities:
            drop:
            - ALL
            add:
            - SYS_PTRACE  # Required for debugging crashed processes
      volumes:
      - name: config-volume
        configMap:
          name: clusterfuzz-config
      - name: work-volume
        emptyDir:
          sizeLimit: 10Gi
      - name: temp-volume
        emptyDir:
          sizeLimit: 2Gi
      - name: corpus-volume
        persistentVolumeClaim:
          claimName: clusterfuzz-corpus-pvc
      nodeSelector:
        kubernetes.io/os: linux
        clusterfuzz.google.com/bot-pool: "standard"
      tolerations:
      - key: "clusterfuzz.google.com/bot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - clusterfuzz-bot
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clusterfuzz-corpus-pvc
  namespace: clusterfuzz
  labels:
    app: clusterfuzz
    component: storage
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clusterfuzz-bot-hpa
  namespace: clusterfuzz
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clusterfuzz-bot
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      selectPolicy: Min
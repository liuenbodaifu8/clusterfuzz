apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterfuzz-web
  namespace: clusterfuzz
  labels:
    app: clusterfuzz-web
    component: web
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: clusterfuzz-web
  template:
    metadata:
      labels:
        app: clusterfuzz-web
        component: web
        version: v1
    spec:
      serviceAccountName: clusterfuzz-web
      containers:
      - name: clusterfuzz-web
        image: gcr.io/clusterfuzz/clusterfuzz-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: management
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes,production"
        - name: JAVA_OPTS
          value: "-Xmx2g -Xms1g -XX:+UseG1GC -XX:+UseStringDeduplication"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: clusterfuzz-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: clusterfuzz-secrets
              key: redis-url
        - name: GOOGLE_CLOUD_PROJECT
          valueFrom:
            configMapKeyRef:
              name: clusterfuzz-config
              key: gcp-project-id
        - name: STORAGE_BUCKET
          valueFrom:
            configMapKeyRef:
              name: clusterfuzz-config
              key: storage-bucket
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: temp-volume
          mountPath: /tmp
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config-volume
        configMap:
          name: clusterfuzz-config
      - name: temp-volume
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "clusterfuzz.google.com/web"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - clusterfuzz-web
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: clusterfuzz-web-service
  namespace: clusterfuzz
  labels:
    app: clusterfuzz-web
    component: web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: management
  selector:
    app: clusterfuzz-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clusterfuzz-web-ingress
  namespace: clusterfuzz
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - clusterfuzz.example.com
    secretName: clusterfuzz-web-tls
  rules:
  - host: clusterfuzz.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clusterfuzz-web-service
            port:
              number: 80